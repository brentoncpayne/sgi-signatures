<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* Layout: dispatch board. Sticky command bar, tabbed admin console, single-column escort card. */
:root{
  --bg:#F1F2EE; --panel:#FFFFFF; --sunk:#E6E9E1; --line:#CFD4C8;
  --ink:#161A14; --muted:#5D6657; --accent:#4E6B2A; --accent-ink:#FFFFFF;
  --arrive:#1C7A55; --arrive-bg:#DDF1E7; --depart:#A4501A; --depart-bg:#F8E6D8;
  --warn:#9A6B00; --warn-bg:#FBF0CF; --gone:#6B7480; --gone-bg:#E6E9ED; --danger:#B3261E;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --brand:#4E6B2A; --on-brand:#FFFFFF;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111410; --panel:#1A1E18; --sunk:#22281F; --line:#333B2E;
  --ink:#E6EAE1; --muted:#9BA693; --accent:#A3C46E; --accent-ink:#141A0E;
  --arrive:#5FCB9A; --arrive-bg:#163327; --depart:#F0A06A; --depart-bg:#3A2416;
  --warn:#E8C060; --warn-bg:#352B10; --gone:#8C96A2; --gone-bg:#232C36; --danger:#F08A82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111410; --panel:#1A1E18; --sunk:#22281F; --line:#333B2E;
  --ink:#E6EAE1; --muted:#9BA693; --accent:#A3C46E; --accent-ink:#141A0E;
  --arrive:#5FCB9A; --arrive-bg:#163327; --depart:#F0A06A; --depart-bg:#3A2416;
  --warn:#E8C060; --warn-bg:#352B10; --gone:#8C96A2; --gone-bg:#232C36; --danger:#F08A82; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--on-brand);border-bottom:3px solid color-mix(in srgb,var(--brand) 70%,#fff)}
header.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;min-width:0}

.logo-chip img{height:32px;width:auto;display:block}
.wm{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.06em;color:var(--brand);line-height:1;padding:0 4px}
.badge-co{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.8}

td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
.mono,.t{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}

.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-exp{background:var(--warn-bg);color:var(--warn)} .p-on{background:var(--arrive-bg);color:var(--arrive)}
.p-out{background:var(--gone-bg);color:var(--gone)} .p-can{background:var(--gone-bg);color:var(--gone);text-decoration:line-through}
.p-flag{background:var(--warn-bg);color:var(--warn)} .p-armed{background:var(--depart-bg);color:var(--depart)} .p-depart{background:var(--depart-bg);color:var(--depart)} .p-grp{background:var(--sunk);color:var(--muted)} .p-joined{background:var(--arrive-bg);color:var(--arrive)} .p-inv{background:var(--sunk);color:var(--accent)} .p-self{background:var(--sunk);color:var(--accent)}
.wkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

.plan .stat.need b{color:var(--accent)}
.plan .stat.gap b{color:var(--danger)} .plan .stat.ok b{color:var(--arrive)}
.ask{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--sunk);border-radius:var(--r);padding:12px 14px}
.ask label{flex:0 1 140px}
.steps{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.grid2>*{min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .nm{font-family:var(--display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{background:var(--sunk);border-radius:4px;padding:6px 8px;font-size:12.5px;min-height:32px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.rcard.full{border-color:color-mix(in srgb,var(--arrive) 45%,var(--line))}
.rcard .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rcard .nm{font-family:var(--display);font-weight:600;font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.bed{display:grid;gap:4px}
.bed label{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bed select{font-weight:600}
.bed.open select{color:var(--muted);font-weight:400;border-style:dashed}
input.filled{background:var(--arrive-bg);transition:background .3s}
.slot.empty{color:var(--muted);font-style:italic;background:transparent;border:1px dashed var(--line)}
.timeline{display:grid;gap:16px}
.day h4{margin:0 0 6px;font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mv{display:grid;grid-template-columns:62px 22px 1fr;gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.mv .dir{font-weight:700;font-family:var(--mono);text-align:center;border-radius:3px;font-size:12px;line-height:20px}
.mv .in{background:var(--arrive-bg);color:var(--arrive)} .mv .out{background:var(--depart-bg);color:var(--depart)}
.empty-state{padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty-state strong{color:var(--ink);font-size:15px}
/* forms */
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:100%;max-width:640px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet .bd{padding:16px;display:grid;gap:14px}
.sheet .ft{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:400 14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 9px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
textarea{min-height:64px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
.check input{width:auto}
.fieldset-title{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px}
.note{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:30}
/* escort view */
.me{display:grid;gap:16px;max-width:720px;margin:0 auto;width:100%}
.me-hero{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:6px}
.me-hero .nm{font-family:var(--display);font-size:36px;font-weight:700;text-transform:uppercase;line-height:1;letter-spacing:.01em}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:14px}
.kv dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0;min-width:0}
.big-t{font-family:var(--mono);font-size:16px;font-weight:500}
.picker{display:grid;gap:6px}
.picker button{text-align:left}
.linkbox{display:flex;gap:6px}
.linkbox input{font-family:var(--mono);font-size:12px}
.chatgrid{grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}
@media (max-width:860px){.chatgrid{grid-template-columns:1fr}}
.chat{display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.chat-log{display:flex;flex-direction:column;gap:8px;padding:14px;max-height:56vh;min-height:220px;overflow-y:auto;background:var(--bg)}
.msg{max-width:min(78%,520px);display:grid;gap:2px;align-self:flex-start}
.msg.mine{align-self:flex-end;text-align:right}
.msg .who{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.msg .who .lead{color:var(--accent)}
.msg .txt{background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 10px 3px;padding:7px 11px;white-space:pre-wrap;word-wrap:break-word;text-align:left}
.msg.mine .txt{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:10px 10px 3px 10px}
.msg.lead:not(.mine) .txt{border-color:var(--accent)}
.chat-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end}
.chat-in textarea{min-height:42px;max-height:140px}
.members{display:flex;flex-wrap:wrap;gap:6px}
.unread{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}

@media (max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}.badge-site{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(() => {
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const S = { escorts:{}, rooms:{}, cars:{}, teams:{}, site:{}, checkins:{}, chat:{}, pool:{}, weeks:{} };
const P = { q:"", grp:"all", status:"avail", sel:new Set(), qs:false };
const R = { escorts:{} };
let ESCORT_ID=null, HALT=""; const newToken=()=>{ const a=new Uint8Array(18); crypto.getRandomValues(a); return Array.from(a,b=>b.toString(36).padStart(2,"0")).join("").slice(0,24); };
let db=null, user=null, isAdmin=false, viewMode="escort", tab="overview", downloads=null, myUid=null, weekOff=1, dirty=false, profiles={};
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

/* ---------- dates ---------- */
const D = s => s ? new Date(s) : null;
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const p2 = n => String(n).padStart(2,"0");
const fT = s => { const d=D(s); return d&&!isNaN(d)? `${p2(d.getHours())}${p2(d.getMinutes())}` : "" };
const fDay = s => { const d=D(s); return d&&!isNaN(d)? `${DAYS[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}` : "" };
const fDT = s => s ? `${fDay(s)} · ${fT(s)}` : "—";
const fISO = iso => { const d=iso?new Date(iso):null; return d&&!isNaN(d)? `${DAYS[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()} · ${p2(d.getHours())}${p2(d.getMinutes())}` : "—" };
const fD = s => s ? fDay(s.length===10? s+"T12:00": s) : "—";
const dayKey = s => s ? s.slice(0,10) : "";

const ymd = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
function weekStartOf(date){ const ws=+(S.site.weekStart ?? 0); const d=new Date(date.getFullYear(),date.getMonth(),date.getDate()); d.setDate(d.getDate()-((d.getDay()-ws+7)%7)); return d; }
function weekRange(off){ const s=weekStartOf(new Date()); s.setDate(s.getDate()+7*off); const e=new Date(s); e.setDate(e.getDate()+6); return {from:ymd(s),to:ymd(e)}; }
const inWeek = (str,w) => { const k=dayKey(str); return !!k && k>=w.from && k<=w.to; };
const stayT = e => !e.stayUntil ? "" : e.stayUntil==="none" ? "Can't extend" : `Can stay to ${fD(e.stayUntil)}`;
const hasRental = e => !!(e && (carsFor(e).length || carIn(e)));
const carIn = e => e.carInName && e.carInName.has ? e.carInName : null;
const carNameT = e => { const c=carIn(e); if(c) return "Yes"; if(e.carInName && e.carInName.has===false) return "No"; return ""; };
const arrT = e => e.arriveAt ? (e.arriveTbd ? `${fDay(e.arriveAt)} · time TBD` : fDT(e.arriveAt)) : "—";
/* merge escort-reported departures onto the roster */
function merge(){
  const byE={};
  for(const [u,c] of Object.entries(S.checkins)){ if(!c||!c.escortId) continue; const k=c.reportedAt||c.claimedAt||""; const p=byE[c.escortId]; if(!p||k>(p.reportedAt||p.claimedAt||"")) byE[c.escortId]={uid:u,...c}; }
  const out={};
  for(const [id,e] of Object.entries(R.escorts)){
    const m={...e}, c=byE[id];
    if(c){ m.claimedBy=c.uid; m.claimedAt=c.claimedAt; m.stayUntil=c.stayUntil||""; m.svc=c.svc||null; m.carInName=c.carInName||null;
      if(c.departAt && (c.reportedAt||"")>(e.departSetAt||"")){ m.departAt=c.departAt; m.departBy="escort"; m.departReportedAt=c.reportedAt; m.escortNote=c.note||""; } }
    const a=e.carInNameAdmin; if(a && (!m.carInName || (a.at||"")>=(m.carInName.at||""))) m.carInName={...a, byAdmin:true};
    out[id]=m;
  }
  S.escorts=out;
}
/* weekly staffing math */
function weekPlan(w){
  const es=escorts().filter(e=>status(e).k!=="can");
  const startTs=w.from+"T00:00", endTs=w.to+"T23:59";
  const presentAtStart=e=> e.arriveAt && e.arriveAt<startTs && (!e.departAt || e.departAt>=startTs) && e.state!=="departed";
  const staying=es.filter(e=>presentAtStart(e) && (!e.departAt || e.departAt>endTs));
  const leaving=es.filter(e=>presentAtStart(e) && e.departAt && e.departAt>=startTs && e.departAt<=endTs);
  const arriving=es.filter(e=>inWeek(e.arriveAt,w));
  const arrLeaving=arriving.filter(e=>e.departAt && e.departAt<=endTs);
  const req=S.weeks[w.from]||{};
  const needed= req.needed===undefined||req.needed===""? null : +req.needed;
  const armedNeeded= req.armedNeeded===undefined||req.armedNeeded===""? null : +req.armedNeeded;
  const covered=staying.length+arriving.length;
  const open= needed==null? null : Math.max(0, needed-covered);
  const over= needed==null? 0 : Math.max(0, covered-needed);
  const isArmed=e=>/armed/i.test(e.notes||"") || Object.values(S.pool).some(p=>p.armed && digits(p.phone) && digits(p.phone)===digits(e.phone));
  const armedCovered=[...staying,...arriving].filter(isArmed).length;
  const canExtend=leaving.filter(e=>e.stayUntil && e.stayUntil!=="none" && e.stayUntil>w.to);
  return {req,needed,armedNeeded,staying,leaving,arriving,arrLeaving,covered,open,over,armedCovered,canExtend};
}

function status(e){
  if(e.state==="cancelled") return {k:"can",t:"Cancelled"};
  const now=Date.now(), a=D(e.arriveAt), d=D(e.departAt);
  if(e.state==="departed" || (d && d.getTime()<=now)) return {k:"out",t:"Departed"};
  if(e.state==="arrived" || (a && a.getTime()<=now)) return {k:"on",t:"On site"};
  return {k:"exp",t:"Expected"};
}
function roomBeds(rid){
  const occ=escorts().filter(e=>e.roomId===rid && !["can","out"].includes(status(e).k));
  const beds=[null,null];
  occ.filter(e=>e.bed===1||e.bed===2).forEach(e=>{ if(!beds[e.bed-1]) beds[e.bed-1]=e; });
  occ.filter(e=>!beds.includes(e)).forEach(e=>{ const i=beds.indexOf(null); if(i>=0) beds[i]=e; });
  return beds;
}

    const add=parsed.filter(p=>!p.dup);

    $("#in_add").disabled=!add.length; $("#in_add").textContent= add.length? `Add ${add.length} to roster` : "Add to roster";
  };
  $("#in_add").onclick=async()=>{
    const add=parsed.filter(p=>!p.dup); if(!add.length) return;
    $("#in_add").disabled=true; $("#in_msg").textContent="Adding…";
    for(const p of add){ try{ await db.collection("escorts").doc(uid("e")).set({name:p.name,phone:p.phone,arriveAt:p.arriveAt,arriveTbd:p.tbd,socWeek:w.from,addedVia:"SOC list",addedAt:new Date().toISOString()}); }catch(e){ $("#in_msg").textContent="Stopped: "+(e.message||e.code); return; } }
    toast(`Added ${add.length} escort${add.length>1?"s":""}`); dirty=false; render();
  };
}
function parseList(text, defDate){
  const out=[]; const y=(defDate||ymd(new Date())).slice(0,4);
  for(const line of text.split(/\r?\n/)){
    const parts=line.split(/\t|,|;|\s{2,}|\s+-\s+/).map(x=>x.trim()).filter(Boolean); if(!parts.length) continue;
    let name=[], phone="", date="", time="";
    for(const p of parts){
      let m;
      if((m=p.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) date=`${m[1]}-${p2(m[2])}-${p2(m[3])}`;
      else if((m=p.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/))) date=`${m[3]?(m[3].length===2?"20"+m[3]:m[3]):y}-${p2(m[1])}-${p2(m[2])}`;
      else if((m=p.match(/^(\d{1,2}):?(\d{2})\s*(am|pm)?$/i)) && +m[1]<24 && +m[2]<60){ let h=+m[1]; if(m[3]){ const pm=/pm/i.test(m[3]); if(pm&&h<12)h+=12; if(!pm&&h===12)h=0; } time=`${p2(h)}:${m[2]}`; }
      else if(p.replace(/\D/g,"").length>=7 && /^[+\d\s().-]+$/.test(p)) phone=p;
      else name.push(p);
    }
    const nm=name.join(" ").replace(/^\d+[.)]\s*/,"").trim(); if(!nm) continue;
    const d=date||defDate||ymd(new Date());
    out.push({name:nm, phone:fmtPhone(phone), arriveAt:`${d}T${time||"12:00"}`, tbd:!time});
  }
  return out;
}

function fmtPhone(v){
  let d=String(v||"").replace(/\D/g,""); if(d.length===11&&d[0]==="1") d=d.slice(1); d=d.slice(0,10);
  if(d.length<4) return d; if(d.length<7) return `${d.slice(0,3)}-${d.slice(3)}`; return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
}
document.addEventListener("input", ev=>{ const el=ev.target; if(!(el instanceof HTMLInputElement) || el.getAttribute("inputmode")!=="tel") return;
  const atEnd=el.selectionStart===el.value.length, f=fmtPhone(el.value); if(f!==el.value){ el.value=f; if(atEnd) el.setSelectionRange(f.length,f.length); } });
const digits = p => String(p||"").replace(/\D/g,"").replace(/^1(?=\d{10}$)/,"");
function rosterMatch(pp){
  const d=digits(pp.phone), n=(pp.name||"").trim().toLowerCase();
  return Object.entries(R.escorts).map(([id,e])=>({id,...e})).find(e=> (d && digits(e.phone)===d) || (!d && n && (e.name||"").trim().toLowerCase()===n) || e.poolId===pp.id);
}
function poolList(){
  return Object.entries(S.pool).map(([id,p])=>({id,...p})).sort((a,b)=>(!a.name)-(!b.name) || (a.name||"").localeCompare(b.name||"") || (a.phone||"").localeCompare(b.phone||""));
}

async function setBed(rid, i, eid){
  const beds=roomBeds(rid), cur=beds[i];
  if(cur && cur.id===eid) return;
  if(cur) await patch("escorts", cur.id, {roomId:"", bed:null});
  if(eid){ const other=beds[1-i]; if(other && other.id===eid){ await patch("escorts", eid, {bed:i+1}); }
           else await patch("escorts", eid, {roomId:rid, bed:i+1}); }

/* ---------- room servicing ---------- */
const addDays=(ymdStr,n)=>{ const d=new Date(ymdStr+"T12:00"); d.setDate(d.getDate()+n); return ymd(d); };
const todayYMD=()=>ymd(new Date());
function serviceInfo(r){
  const every=+(r.serviceEvery ?? S.site.serviceEvery ?? 7) || 0;
  let due = r.serviceNext || "";
  if(!due && every){ const base=r.lastServiced||r.checkIn; if(base) due=addDays(base, every); }
  const co=roomCheckout(r); if(co && due && due>=co) due="";
  const t=todayYMD();
  const days = due ? Math.round((new Date(due+"T12:00")-new Date(t+"T12:00"))/864e5) : null;
  let k="none", label="No service scheduled";
  if(r.serviceHold){ k="hold"; label="On hold (do not disturb)"; }
  else if(due){ if(days<0){k="over";label=`Overdue ${-days} day${days===-1?"":"s"}`} else if(days===0){k="today";label="Service today"} else if(days===1){k="soon";label="Service tomorrow"} else {k="later";label=`Service ${fD(due)}`} }
  return {every, due, days, k, label};
}
const svcPill = r => { const si=serviceInfo(r); const cls={over:"p-flag",today:"p-depart",soon:"p-exp",later:"p-grp",hold:"p-out",none:"p-out"}[si.k]; return `<span class="pill ${cls}">${esc(si.label)}</span>`; };
const SVC_TYPES=["Window bed","Bathroom bed","Whole room","Towels only"];
const openReq = e => e && e.svc && e.svc.type && !e.svc.doneAt ? e.svc : null;
const reqPill = e => { const r=openReq(e); return r?`<span class="pill p-depart">${esc(r.type)}</span>`:""; };
function openRequests(){ return escorts().filter(e=>openReq(e) && !["can","out"].includes(status(e).k)).map(e=>({e, r:openReq(e), room:S.rooms[e.roomId]})).sort((a,b)=>roomLabel(a.room).localeCompare(roomLabel(b.room),undefined,{numeric:true})); }
async function markServiced(rid){ const d=todayYMD(), now=new Date().toISOString();
  await patch("rooms", rid, {lastServiced:d, serviceNext:"", serviceLog:[...((S.rooms[rid]||{}).serviceLog||[]).slice(-29), d]});
  for(const e of roomOcc(rid)) if(openReq(e) && e.claimedBy){ try{ await db.collection("checkins").doc(e.claimedBy).update({svc:{...e.svc, doneAt:now}}); }catch(err){} }
  toast(`${roomLabel(S.rooms[rid])} marked serviced today`); }
/* ---------- front desk list (today's room service) ---------- */
function frontDesk(){
  const t=todayYMD(), tm=addDays(t,1);
  const rooms=list("rooms").map(r=>({...r, occ:roomOcc(r.id).filter(e=>status(e).k!=="out")}))
    .filter(r=>r.occ.length).sort((a,b)=>(a.hotel||"").localeCompare(b.hotel||"")||String(a.number||"").localeCompare(String(b.number||""),undefined,{numeric:true}));
  const items=[];
  for(const r of rooms){
    const reqs=r.occ.filter(openReq).map(e=>({e, r:openReq(e)}));
    const si=serviceInfo(r), routine=["over","today"].includes(si.k);
    if(!reqs.length && !routine) continue;
    let what;
    if(reqs.some(x=>x.r.type==="Whole room")) what="Whole room";
    else if(reqs.length) what=[...new Set(reqs.map(x=>x.r.type))].join(" + ");
    else what="Whole room";
    const notes=reqs.map(x=>x.r.note).filter(Boolean);
    items.push({room:r, what, notes, routine:!reqs.length, who:reqs.map(x=>x.e.name), overdue:si.k==="over"&&!reqs.length});
  }
  const live=escorts().filter(e=>!["can","out"].includes(status(e).k));
  const leaving=live.filter(e=>e.departAt && (dayKey(e.departAt)===t || dayKey(e.departAt)===tm));
  const canStay=leaving.filter(e=>e.stayUntil && e.stayUntil!=="none" && e.stayUntil>dayKey(e.departAt));
  const hotels=[...new Set(items.map(i=>i.room.hotel||"Hotel"))];
  const text=`ROOM SERVICE — ${fD(t)}\n`+(items.length? hotels.map(h=>`${h}\n`+items.filter(i=>(i.room.hotel||"Hotel")===h).map(i=>`Rm ${i.room.number} — ${i.what}${i.notes.length?` (${i.notes.join("; ")})`:""}`).join("\n")).join("\n\n") : "No room service needed today.");
  return {t, items, hotels, leaving, canStay, text};
}

  return `<div class="panel"><div class="hd"><h3>Front desk list · ${fD(f.t)}</h3><span class="note">What to give the hotel today</span><div class="spacer"></div>${f.items.length?`<button class="btn sm" data-fd-copy="1">Copy list</button>`:""}${compact?`<button class="btn sm" data-tab-go="rooms">Hotel rooms</button>`:""}</div><div class="bd" style="display:grid;gap:12px">
    ${f.items.length? f.hotels.map(h=>`<div style="display:grid;gap:6px"><b>${esc(h)}</b>${f.items.filter(i=>(i.room.hotel||"Hotel")===h).map(i=>`

        <div style="flex:1;min-width:0"><b>${esc(i.what)}</b>${i.notes.length?` <span class="note">(${esc(i.notes.join("; "))})</span>`:""}

        <button class="btn sm" data-serviced="${i.room.id}">Serviced</button></div>`).join("")}</div>`).join("")

function shrink(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,480/img.width,160/img.height); const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/png")); }; img.onerror=()=>{toast("That image could not be read");res(null)}; img.src=r.result; }; r.readAsDataURL(file); }); }

function modal(title, body, onSave, onDelete){

  const close=()=>root.innerHTML="";
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  $(".overlay",root).onclick=e=>{ if(e.target.classList.contains("overlay")) close(); };
  $("#mForm").onsubmit=e=>{e.preventDefault(); $("#mSave").click();};

  let y=78;

  const table=(head,body,opts={})=>{ doc.autoTable({...tableBase,startY:y,head:[head],body:body.length?body:[[{content:"None for this period",colSpan:head.length,styles:{textColor:[110,120,130],fontStyle:"italic"}}]],...opts}); y=doc.lastAutoTable.finalY+22; };

function copyText(text, okMsg, markIds){
  const mark = () => { for(const id of markIds||[]) if(!R.escorts[id]?.invitedAt) patch("escorts", id, {invitedAt:new Date().toISOString()}); };
  const fallback = () => modal("Copy invite", `<p class="note" style="margin:0">Select the text below and copy it, then send it to the escort.</p><textarea id="m_copy" style="min-height:220px;font-size:13px" readonly>${esc(text)}</textarea>`, async()=>{ mark(); }, null);
  try{ navigator.clipboard.writeText(text).then(()=>{ mark(); toast(okMsg); }, fallback); }catch(e){ fallback(); }
}

document.addEventListener("click", ev=>{

  if(t.dataset.tab||t.dataset.tabGo){ tab=t.dataset.tab||t.dataset.tabGo; ls.set("njsb_tab",tab); return render(); }
  if(viewMode==="admin"){
    if(t.dataset.serviced) return markServiced(t.dataset.serviced);
    if(t.dataset.fdCopy) return copyText(frontDesk().text, "Front desk list copied", []);
    if(t.dataset.carFrom){ const e=S.escorts[t.dataset.carFrom], c=carIn(e); return save("cars", uid("c"), {vehicle:c.vehicle||"", assignedTo:t.dataset.carFrom, color:"", agency:"", notes:"Reported by escort"}); }

    if(t.dataset.wkEdit) return editWeekNeed(t.dataset.wkEdit);
    if(t.dataset.wkOpen!==undefined){ weekOff=+t.dataset.wkOpen; tab="week"; return render(); }
    if(t.dataset.wk){ weekOff = t.dataset.wk==="reset" ? 1 : weekOff+(+t.dataset.wk); return render(); }
    if(t.dataset.invite){ const e=S.escorts[t.dataset.invite]; return copyText(inviteText({id:t.dataset.invite,...e}), "Invite copied", [t.dataset.invite]); }
    if(t.dataset.copyAll){ const w=weekRange(weekOff); const es=escorts().filter(e=>status(e).k!=="can"&&inWeek(e.arriveAt,w)); return copyText(es.map(inviteText).join("\n\n———\n\n"), `${es.length} invites copied`, es.filter(e=>!e.invitedAt).map(e=>e.id)); }

    if(t.dataset.editEscort) return editEscort(t.dataset.editEscort);
    if(t.dataset.editRoom) return editRoom(t.dataset.editRoom);
    if(t.dataset.editCar) return editCar(t.dataset.editCar);
    if(t.dataset.editTeam) return editTeam(t.dataset.editTeam);
  }
  if(t.dataset.copy!==undefined){ const inp=$("#"+t.dataset.copy); const done=()=>toast("Link copied"); try{ navigator.clipboard.writeText(inp.value).then(done,()=>{inp.select();toast("Press Ctrl/Cmd+C to copy")}); }catch(e){ inp.select(); toast("Press Ctrl/Cmd+C to copy"); } return; }
  if(t.dataset.pick!==undefined){ ls.set("njsb_me",t.dataset.pick); if(location.hash) history.replaceState(null,"",location.pathname+location.search); render(); }
});
$("#switchView").onclick=()=>{ viewMode=viewMode==="admin"?"escort":"admin"; render(); };
window.addEventListener("hashchange",render);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#modalRoot").innerHTML=""; });

/* ---------- boot (Supabase) ---------- */
$("#app").addEventListener("input", ()=>{ dirty=true; });
const busy = () => !!$("#modalRoot").innerHTML || dirty || (viewMode==="admin"&&(tab==="settings"||tab==="report"));
let raf=0; const sched=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ if(!busy()) render(); else renderHeader(); }); };
const deep = o => JSON.parse(JSON.stringify(o ?? {}));
function makeSnap(map){ const docs=Object.entries(map).map(([id,data])=>({id, exists:true, data:()=>deep(data)})); return {docs, size:docs.length, empty:!docs.length}; }
function refErr(code,message){ const e=new Error(message||code); e.code=code; return e; }

/* Admin store: whole table cached, live via Supabase realtime */
function adminDB(sb){
  const cache={}, subs=[];
  const col=c=>(cache[c] ??= {});
  const emit=c=>subs.filter(s=>s.c===c).forEach(s=>s.fn(s.id? {id:s.id, exists:!!cache[c]?.[s.id], data:()=>deep(cache[c]?.[s.id])} : makeSnap(col(c))));
  const put=async(c,id,data)=>{ if(c==="escorts" && !data.token) data.token=(col(c)[id]?.token)||newToken(); col(c)[id]=data; emit(c); const {error}=await sb.from("docs").upsert({collection:c,id,data,updated_at:new Date().toISOString()}); if(error) throw refErr("save_failed",error.message); };
  const docRef=(c,id)=>({ id,
    get: async()=>({id, exists:!!col(c)[id], data:()=>deep(col(c)[id])}),
    set: data=>put(c,id,deep(data)),
    update: async patch=>{ const cur=deep(col(c)[id]); for(const [k,v] of Object.entries(patch)){ if(v&&typeof v==="object"&&v.__delete__) delete cur[k]; else cur[k]=v; } return put(c,id,cur); },
    delete: async()=>{ delete col(c)[id]; emit(c); const {error}=await sb.from("docs").delete().match({collection:c,id}); if(error) throw refErr("delete_failed",error.message); },
    onSnapshot:(fn)=>{ subs.push({c,id,fn}); fn({id, exists:!!col(c)[id], data:()=>deep(col(c)[id])}); return ()=>{}; } });
  const api={
    collection:c=>({ doc:id=>docRef(c,id||uid("x")), onSnapshot:(fn)=>{ subs.push({c,fn}); fn(makeSnap(col(c))); return ()=>{}; } }),
    doc:path=>{ const [c,id]=path.split("/"); return docRef(c,id); },
    async load(){ let from=0; for(;;){ const {data,error}=await sb.from("docs").select("collection,id,data").range(from,from+999); if(error) throw error; data.forEach(r=>col(r.collection)[r.id]=r.data); if(data.length<1000) break; from+=1000; } },
    live(){ sb.channel("docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{ const r=p.new&&p.new.collection?p.new:p.old; if(!r||!r.collection) return; if(p.eventType==="DELETE") delete col(r.collection)[r.id]; else col(r.collection)[r.id]=p.new.data; emit(r.collection); }).subscribe(); },
    emitAll(){ Object.keys(cache).forEach(emit); }
  };
  return api;
}

/* Escort store: read-only snapshot from escort_view(token); writes go through escort_submit / escort_chat_post */
function escortDB(sb, token){
  const cache={}, subs=[];
  const col=c=>(cache[c] ??= {});
  const emit=c=>subs.filter(s=>s.c===c).forEach(s=>s.fn(s.id? {id:s.id, exists:!!col(c)[s.id], data:()=>deep(col(c)[s.id])} : makeSnap(col(c))));
  const denied=()=>Promise.reject(refErr("invalid_argument","not allowed"));
  const docRef=(c,id)=>({ id,
    set: async data=>{
      if(c==="checkins"){ const {error}=await sb.rpc("escort_submit",{p_token:token,p_patch:data}); if(error) throw refErr("save_failed",error.message); await api.refresh(); return; }
      if(c==="chat"){ const last=(data.msgs||[]).slice(-1)[0]; const {error}=await sb.rpc("escort_chat_post",{p_token:token,p_text:last?.text||""}); if(error) throw refErr("save_failed",error.message); await api.refresh(); return; }
      return denied(); },
    update: async patch=> c==="checkins" ? docRef(c,id).set(patch) : denied(),
    delete: denied,
    onSnapshot:(fn)=>{ subs.push({c,id,fn}); fn({id, exists:!!col(c)[id], data:()=>deep(col(c)[id])}); return ()=>{}; } });
  const api={
    me:null,
    collection:c=>({ doc:id=>docRef(c,id), onSnapshot:(fn)=>{ subs.push({c,fn}); fn(makeSnap(col(c))); return ()=>{}; } }),
    doc:path=>{ const [c,id]=path.split("/"); return docRef(c,id); },
    async refresh(){ const {data,error}=await sb.rpc("escort_view",{p_token:token}); if(error) throw error; if(!data) return false;
      api.me=data.me; for(const k of ["escorts","rooms","teams","cars","checkins","chat"]) cache[k]=data[k]||{}; cache.config={site:data.site||{}}; cache.weeks={}; cache.pool={};
      ["escorts","rooms","teams","cars","checkins","chat","config","weeks","pool"].forEach(emit); return true; }
  };
  return api;
}

function wireStore(){
  for(const k of ["rooms","cars","teams"]) db.collection(k).onSnapshot(snap=>{ S[k]={}; snap.docs.forEach(d=>S[k][d.id]=d.data()); sched(); });
  db.collection("escorts").onSnapshot(snap=>{ R.escorts={}; snap.docs.forEach(d=>R.escorts[d.id]=d.data()); merge(); sched(); });
  db.collection("weeks").onSnapshot(snap=>{ S.weeks={}; snap.docs.forEach(d=>S.weeks[d.id]=d.data()); sched(); });
  if(isAdmin) db.collection("pool").onSnapshot(snap=>{ const own={}, imp={};
    snap.docs.forEach(d=>{ const x=d.data()||{}; if(Array.isArray(x.people)) x.people.forEach(p=>{ if(p&&p.id) imp[p.id]={...p,source:x.source||p.source}; }); else own[d.id]=x; });
    S.pool={}; for(const [id,p] of Object.entries({...imp,...own})) if(!p.deleted) S.pool[id]=p; sched(); });
  db.collection("chat").onSnapshot(snap=>{ S.chat={}; snap.docs.forEach(d=>S.chat[d.id]=d.data()); if($("#chatLog")) updateChatLog(); else renderHeader(); });
  db.collection("checkins").onSnapshot(snap=>{ S.checkins={}; snap.docs.forEach(d=>S.checkins[d.id]=d.data()); merge(); sched(); });
  db.doc("config/site").onSnapshot(d=>{ S.site=d.exists? d.data(): {}; sched(); });
}

function loginScreen(sb, msg){
  $("#tabs").hidden=true; $("#switchView").hidden=true; $("#modeTag").textContent="Site lead";
  $("#app").innerHTML=`<div class="me"><div class="me-hero"><h2>Site lead sign-in</h2><p class="muted" style="margin:0">Escorts don't sign in here. They use the personal link their site lead sends them.</p></div>
  <form class="panel" id="loginForm"><div class="bd" style="display:grid;gap:12px">
    <label class="f">Email<input id="lg_email" type="email" autocomplete="username" required></label>
    <label class="f">Password<input id="lg_pass" type="password" autocomplete="current-password" required></label>
    <div class="row"><button class="btn primary" type="submit">Sign in</button><span class="note" id="lg_msg">${esc(msg||"")}</span></div>
  </div></form></div>`;
  $("#loginForm").onsubmit=async ev=>{ ev.preventDefault(); $("#lg_msg").textContent="Signing in…";
    const {error}=await sb.auth.signInWithPassword({email:v("lg_email"), password:$("#lg_pass").value});
    if(error){ $("#lg_msg").textContent="That email and password didn't work. Check them and try again."; return; }
    location.reload(); };
}

(async()=>{
  const sv=ls.get("njsb_tab"); if(sv) tab=sv; P.qs=!!ls.get("njsb_qs");
  const CFG=window.NJSB_CONFIG||{};
  if(!window.supabase || !CFG.url || !CFG.key){ $("#app").innerHTML=`<div class="panel"><div class="empty-state"><strong>Board not connected yet</strong><span>The database address and key haven't been added to this page.</span></div></div>`; return; }
  const sb=window.supabase.createClient(CFG.url, CFG.key);
  window.__sb=sb;
  const token=(location.hash||"").replace(/^#/,"").replace(/^t=/,"");
  if(token && token.length>=16){
    /* escort mode: personal link, no login */
    isAdmin=false; viewMode="escort";
    db=escortDB(sb, token); wireStore();
    let ok=false; try{ ok=await db.refresh(); }catch(e){}
    if(!ok){ $("#modeTag").textContent="Escort"; HALT=`<div class="panel"><div class="empty-state"><strong>This link isn't active</strong><span>Ask your site lead to send you a new personal link.</span></div></div>`; $("#app").innerHTML=HALT; return; }
    myUid=db.me; ESCORT_ID=db.me;
    if(!S.checkins[myUid]) { try{ await sb.rpc("escort_submit",{p_token:token,p_patch:{}}); await db.refresh(); }catch(e){} }
    render();
    setInterval(()=>{ if(!document.hidden) db.refresh().catch(()=>{}); }, 20000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) db.refresh().catch(()=>{}); });
    return;
  }
  /* admin mode: Supabase sign-in */
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ loginScreen(sb); return; }
  isAdmin=true; myUid="lead"; viewMode="admin";
  db=adminDB(sb);
  try{ await db.load(); }catch(e){ loginScreen(sb, "Couldn't load the board: "+(e.message||e)); return; }
  wireStore(); db.live();
  /* every escort needs a secret link token */
  for(const [id,e] of Object.entries(R.escorts)) if(!e.token) patch("escorts", id, {token:newToken()});
  render();
  setInterval(()=>{ if(!busy() && !document.activeElement?.matches("input,textarea,select")) render(); }, 60000);
})();

})();
