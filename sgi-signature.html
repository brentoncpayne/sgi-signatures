<!--
  Christopher Payne — SGI (Solutions Group International) Email Signature
  Laid out to match the Blue Line "signature 2" reference: no card border/shadow,
  plain white background, vertical divider line, wide logo stacked above the name.
  No icon rail (dropped per your earlier call) — just the divider line on its own.

  ASSETS: sgi-signature-assets/
    sgi-alternator.gif      - the globe↔headshot loop. Whole face (and whole
                               globe) in a genuinely complete circle at full
                               view now — fixed a gap that was still sneaking
                               through at the strip seams. Gaps open and close
                               per strip, in sync with that strip's own wipe —
                               the image breaks apart progressively as the
                               wipe reaches each section, instead of all the
                               white lines fading in/out together.
                               210x260 (displayed 160 wide / 198 auto height), ~139KB.
    sgi-logo-wide-spin.gif  - the wide SGI logo with the globe icon spinning
                               continuously (text stays still). True sphere
                               rotation — surface compresses smoothly toward
                               the edge and reopens on the other side, with
                               each horizontal band compressing at its own
                               rate and tapering out cleanly (fixed a bug
                               that was flattening the top/bottom into
                               square-ish bars). About 4.5s per rotation.
                               Replaces the old static sgi-logo-wide.png.
                               297x42 (displayed 240 wide / 34 auto height), ~27KB.
    sgi-logo-wide.png       - static version, kept in case you ever want the
                               non-animated logo instead — not currently wired in.

  HOSTING: served from your GitHub repo (github.com/brentoncpayne/sgi-signatures)
  via raw.githubusercontent.com — verified both URLs load the right bytes.
  To update an asset later: upload the new file to that repo with the same
  filename and it overwrites in place, no HTML changes needed.

  ANIMATION CAVEAT: Outlook desktop does not animate GIFs for recipients by
  default — it shows the first frame (the globe) frozen. Animates normally in
  Gmail, Apple Mail, and most other clients.
-->
